apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: failsafe
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/ttheoretic/failsafe-web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: failsafe-config }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: failsafe
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: failsafe
  namespace: failsafe
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts: [app.failsafe.ai, api.failsafe.ai]
      secretName: failsafe-tls
  rules:
    - host: api.failsafe.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api, port: { number: 80 } } }
    - host: app.failsafe.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
