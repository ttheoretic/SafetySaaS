# Non-secret configuration. Secrets (DATABASE_URL, tokens, keys) live in the
# `riscly-secrets` Secret — see secrets.example.yaml. Postgres is managed
# (Supabase) and Redis is a managed instance; only the apps run in-cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: riscly-config
  namespace: riscly
data:
  API_PORT: '4000'
  ANTHROPIC_MODEL: claude-opus-4-8
  NEXT_PUBLIC_API_URL: https://api.riscly.ai
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
---
# Template — create the real Secret out-of-band (sealed-secrets / external-secrets).
apiVersion: v1
kind: Secret
metadata:
  name: riscly-secrets
  namespace: riscly
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://USER:PASS@HOST:5432/riscly'
  REDIS_URL: 'redis://HOST:6379'
  SUPABASE_JWT_SECRET: 'REPLACE_ME'
  ANTHROPIC_API_KEY: 'REPLACE_ME'
  STRIPE_SECRET_KEY: 'REPLACE_ME'
  STRIPE_WEBHOOK_SECRET: 'REPLACE_ME'
  CONNECTION_ENCRYPTION_KEY: 'REPLACE_ME_base64_32_bytes'
